backend:
  name: git-gateway
  branch: main

locale: ar

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: site
    label: "محتوى الموقع"
    files:
      - name: content
        label: "النصوص الأساسية"
        file: "content.json"
        fields:
          - { name: hero_title_highlight, label: "الهيرو — الجزء الأصفر", widget: string }
          - { name: hero_text, label: "الهيرو — النص التعريفي", widget: text }
          - { name: phone_display, label: "رقم التليفون (كما يظهر)", widget: string }
          - { name: address, label: "العنوان", widget: string }
          - { name: hours, label: "المواعيد", widget: string }
          - { name: facilities_title, label: "عنوان قسم الأقسام", widget: string }
          - { name: gallery_title, label: "عنوان قسم الصور", widget: string }
          - { name: trainer_title, label: "عنوان قسم المدرب", widget: string }
          - { name: pricing_note, label: "ملاحظة الأسعار", widget: text }
          - { name: cta_title, label: "عنوان فورم الحجز", widget: string }
          - { name: cta_text, label: "نص فورم الحجز", widget: text }
          - { name: footer_note, label: "وصف الفوتر", widget: text }
