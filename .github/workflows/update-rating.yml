name: تحديث تقييم جوجل
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch rating
        run: node tools/update-rating.mjs --dir .
      - name: Commit if changed
        run: |
          git config user.name "rating-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content.json index.html
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore: تحديث تقييم جوجل تلقائيًا"
            git push
          fi